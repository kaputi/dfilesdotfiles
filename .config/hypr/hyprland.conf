 # ===== Monitors =====
# Run `hyprctl monitors` to find your output names. Adjust resolution/refresh/position.
monitor = DP-1, 2560x1440@144, 0x0, 1
monitor = HDMI-A-1, 1920x1080@60, 2560x0, 1, transform, 3
# transform: 0=normal 1=90° 2=180° 3=270°. Use 1 or 3 for vertical, depending on which side faces up.

# ===== Environment =====
# mongo compass needs GNOME in this list to find the libsecret backend;
# Hyprland is listed first so it remains the primary desktop identity.
# env = XDG_CURRENT_DESKTOP,Hyprland:GNOME
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = ELECTRON_OZONE_PLATFORM_HINT,wayland   # native Wayland for Electron (VSCode, your TS apps)
env = MOZ_ENABLE_WAYLAND,1                   # Firefox native Wayland
env = QT_QPA_PLATFORM,wayland;xcb            # Qt apps prefer Wayland, fall back to xcb
env = SDL_VIDEODRIVER,wayland                # SDL games (some emulators)
env = _JAVA_AWT_WM_NONREPARENTING,1          # fix Java GUI apps
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GTK_THEME,Adwaita-dark
env = XCURSOR_THEME,phinger-cursors-light

# ===== Autostart =====
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = waybar
exec-once = ags run -d ~/.config/ags
exec-once = swaync
exec-once = swww-daemon
exec-once = waypaper --restore
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = blueman-applet
exec-once = thunderbird
exec-once = nm-applet
exec-once = hypridle
# Refresh waybar's custom/layout module on workspace/monitor focus changes
exec-once = sh -c 'socat -U - UNIX-CONNECT:"$XDG_RUNTIME_DIR/hypr/$HYPRLAND_INSTANCE_SIGNATURE/.socket2.sock" | while IFS= read -r line; do case "$line" in workspace*|focusedmon*|configreloaded*) pkill -SIGRTMIN+8 waybar 2>/dev/null ;; esac; done'
bindn = , mouse_down, exec, ~/.local/bin/wheel-focus.sh
bindn = , mouse_up, exec, ~/.local/bin/wheel-focus.sh

# ===== Input =====
input {
    kb_layout = gb
    follow_mouse = 0     # focus only on click; ws.sh reads cursorpos directly to keep awesome-style per-monitor workspace switching
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
    tablet {
        output = DP-1
    }
}

device {
    name = logitech-mx-master-2s-1
    sensitivity = 0
    accel_profile = flat
    scroll_factor = 1.0
}

device {
    name = logitech-wireless-mouse-mx-master-2s-1
    sensitivity = 0
    accel_profile = flat
    scroll_factor = 1.0
}

cursor {
    no_warps = true
    inactive_timeout = 0
    hide_on_key_press = false
    no_hardware_cursors = true
}

# ===== General =====
general {
    gaps_in = 3
    gaps_out = 1
    border_size = 1

    col.active_border = rgba(909090ff)
    col.inactive_border = rgba(2a2a2aff)
    #layout = dwindle             # dwindle (binary, like 'fair') or master (master/stack, like 'tile')
    layout = master
}

decoration {
    rounding = 0

    # Dim unfocused windows (replaces picom's inactive-dim = 0.15)
    dim_inactive = true
    dim_strength = 0.15

    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

# ===== Per-app opacity (replaces picom's opacity-rule) =====
# Format: opacity ACTIVE INACTIVE — single value applies to both.
windowrule = opacity 0.90 0.80, match:class org\.wezfurlong\.wezterm
windowrule = opacity 0.90 0.80, match:class Alacritty

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = windows, 1, 4, ease
    animation = fade, 1, 4, ease
    animation = workspaces, 1, 4, ease
}

dwindle {
    preserve_split = true
}

master {
    new_status = slave           # new windows go to stack, master stays
    orientation = left        # uncomment for tile.bottom equivalent (master on top, stack below)

}

misc {
    disable_splash_rendering = true     # hides "a day without Hyprland is a day wasted" at the bottom
    # disable_hyprland_logo = true      # uncomment to also hide the central anime-girl logo on default background
}

# ===== Keybinds (ported from your AwesomeWM config) =====
$mod = SUPER

# --- Apps & Launchers ---
bind = $mod, Return, exec, wezterm
bind = $mod, F1, exec, wezterm start -- yazi               # file manager
bind = $mod, F2, exec, uwsm app -- com.brave.Browser.desktop
bind = $mod, 0, exec, powerdmenu                            # your custom power menu
bind = $mod, space, exec, fuzzel                            # .desktop app launcher
bind = $mod, d, exec, launch-cmd                            # any PATH binary (script in section 3.5)

# --- WM control ---
bind = $mod CTRL, r, exec, hyprctl reload                   # reload config (was awesome.restart)
bind = $mod CTRL, q, exit                                   # quit Hyprland
bind = $mod, X, exec, hyprlock                              # screen lock
bind = $mod, equal, exec, pkill -SIGUSR1 waybar || waybar &
bind = $mod, grave, exec, swaync-client --close-latest       # dismiss top notification
bind = $mod SHIFT, grave, exec, swaync-client --close-all    # dismiss all notifications
bind = $mod CTRL, grave, exec, swaync-client -t -sw          # toggle notification center

# --- Window control (your clientkeys) ---
bind = $mod, q, exec, close-or-minimize                     # close window (minimizes thunderbird to special workspace)
bind = $mod SHIFT, m, togglespecialworkspace, thundermail     # toggle thunderbird overlay
bind = $mod, n, exec, toggle-stash                          # stash/unstash window
bind = $mod SHIFT, n, togglespecialworkspace, stash          # toggle stash overlay
bind = $mod SHIFT, q, exec, hyprctl kill                    # xkill: click window to SIGKILL, right-click to cancel
bind = $mod, f, fullscreen, 0                               # true fullscreen (your 'max')
bind = $mod, m, fullscreen, 1                               # maximize within tiles (no border)
bind = $mod CTRL, space, togglefloating                     # floating toggle
bind = $mod, t, pin                                         # pin to all workspaces (your 'keep on top')
bind = $mod CTRL, Return, layoutmsg, swapwithmaster         # swap focused with master

# --- Layout switching (replaces awful.layout.inc) ---
# bind = $mod, w, exec, hyprctl keyword general:layout dwindle
# bind = $mod SHIFT, w, exec, hyprctl keyword general:layout master
# Cycle orientation on focused workspace (master-only; wrapper persists state + signals waybar)
bind = SUPER, w, exec, ~/.config/hypr/scripts/orient.sh cycle
# Toggle master ↔ dwindle (restores per-WS orientations on dwindle→master)
bind = SUPER SHIFT, w, exec, ~/.config/hypr/scripts/orient.sh toggle

# --- Focus: vim directional (separated from resize per your preference) ---
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r
#bind = $mod, Tab, focuscurrentorlast                        # alternate with last focused
bind = $mod, Tab, exec, window-picker.sh 

# --- Move window: vim directional ---
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r

# --- Resize active window: vim directional (works tiled and floating) ---
bind = $mod CTRL, h, resizeactive, -50 0
bind = $mod CTRL, j, resizeactive, 0 50
bind = $mod CTRL, k, resizeactive, 0 -50
bind = $mod CTRL, l, resizeactive, 50 0

# --- Mouse drag (hold mod, click+drag) ---
bindm = $mod, mouse:272, movewindow                         # left-button drag = move
bindm = $mod, mouse:273, resizewindow                       # right-button drag = resize

# --- Workspaces (per-monitor, awesome-style: same keys, action follows cursor) ---
# Script picks the right workspace ID based on which monitor is active:
#   DP-1     → 1..9
#   HDMI-A-1 → 11..19
bind = $mod, 1, exec, ~/.config/hypr/scripts/ws.sh switch 1
bind = $mod, 2, exec, ~/.config/hypr/scripts/ws.sh switch 2
bind = $mod, 3, exec, ~/.config/hypr/scripts/ws.sh switch 3
bind = $mod, 4, exec, ~/.config/hypr/scripts/ws.sh switch 4
bind = $mod, 5, exec, ~/.config/hypr/scripts/ws.sh switch 5
bind = $mod, 6, exec, ~/.config/hypr/scripts/ws.sh switch 6
bind = $mod, 7, exec, ~/.config/hypr/scripts/ws.sh switch 7
bind = $mod, 8, exec, ~/.config/hypr/scripts/ws.sh switch 8
bind = $mod, 9, exec, ~/.config/hypr/scripts/ws.sh switch 9

bind = $mod SHIFT, 1, exec, ~/.config/hypr/scripts/ws.sh move 1
bind = $mod SHIFT, 2, exec, ~/.config/hypr/scripts/ws.sh move 2
bind = $mod SHIFT, 3, exec, ~/.config/hypr/scripts/ws.sh move 3
bind = $mod SHIFT, 4, exec, ~/.config/hypr/scripts/ws.sh move 4
bind = $mod SHIFT, 5, exec, ~/.config/hypr/scripts/ws.sh move 5
bind = $mod SHIFT, 6, exec, ~/.config/hypr/scripts/ws.sh move 6
bind = $mod SHIFT, 7, exec, ~/.config/hypr/scripts/ws.sh move 7
bind = $mod SHIFT, 8, exec, ~/.config/hypr/scripts/ws.sh move 8
bind = $mod SHIFT, 9, exec, ~/.config/hypr/scripts/ws.sh move 9

#bind = $mod, Escape, workspace, previous                    # last workspace (your 'last tag')
bind = $mod, Escape, focuscurrentorlast                        # alternate with last focused
bind = $mod, mouse_down, workspace, e+1                     # mod+wheel = workspace switch
bind = $mod, mouse_up, workspace, e-1

# --- Screenshots ---
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -    # region → swappy editor
bind = SHIFT, Print, exec, grim - | wl-copy                  # full screen → clipboard

# --- Clipboard history ---
bind = $mod, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# --- Media keys ---
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindel = , XF86AudioMute, exec, pamixer -t
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ===== Workspace pinning =====
# 9 persistent workspaces per monitor: 1-9 on DP-1, 11-19 on HDMI-A-1.
# persistent:true keeps them in waybar even when empty.
workspace = 1, monitor:DP-1, persistent:true, default:true, layoutopt:orientation:left
workspace = 2, monitor:DP-1, persistent:true, layoutopt:orientation:left
workspace = 3, monitor:DP-1, persistent:true, layoutopt:orientation:left
workspace = 4, monitor:DP-1, persistent:true, layoutopt:orientation:left
workspace = 5, monitor:DP-1, persistent:true, layoutopt:orientation:left
workspace = 6, monitor:DP-1, persistent:true, layoutopt:orientation:left
workspace = 7, monitor:DP-1, persistent:true, layoutopt:orientation:left
workspace = 8, monitor:DP-1, persistent:true, layoutopt:orientation:left
workspace = 9, monitor:DP-1, persistent:true, layoutopt:orientation:left
workspace = 11, monitor:HDMI-A-1, persistent:true, default:true, layoutopt:orientation:top
workspace = 12, monitor:HDMI-A-1, persistent:true, layoutopt:orientation:top
workspace = 13, monitor:HDMI-A-1, persistent:true, layoutopt:orientation:top
workspace = 14, monitor:HDMI-A-1, persistent:true, layoutopt:orientation:top
workspace = 15, monitor:HDMI-A-1, persistent:true, layoutopt:orientation:top
workspace = 16, monitor:HDMI-A-1, persistent:true, layoutopt:orientation:top
workspace = 17, monitor:HDMI-A-1, persistent:true, layoutopt:orientation:top
workspace = 18, monitor:HDMI-A-1, persistent:true, layoutopt:orientation:top
workspace = 19, monitor:HDMI-A-1, persistent:true, layoutopt:orientation:top

# ===== App placement rules (ported from Awesome) =====

# --- Floating ---
windowrule = float on, match:class (?i)^(arandr|blueman-manager|gpick|kruler|messagewin|sxiv|wpa_gui|veromix|xtightvncviewer|qalculate-gtk)$
windowrule = float on, match:class ^(Tor Browser)$
windowrule = float on, match:class (?i)(pinentry|copyq|dta)
windowrule = float on, match:class com.gabm.satty
windowrule = float on, match:title ^(Event Tester|Qalculate!)$

# --- Teams / Slack / Skype → ws 19 (HDMI-A-1), no switch ---
windowrule = opacity 0.85, match:class .*teams_for_linux.*
windowrule = workspace 19 silent, match:class .*teams_for_linux.*
windowrule = workspace 19 silent, match:class (?i).*microsoft.teams.*
windowrule = workspace 19 silent, match:class (?i).*slack.*
windowrule = workspace 19 silent, match:class (?i).*skype.*
windowrule = workspace 19 silent, match:class .*crx_cifhbcnohmdccbgoicgdjpfamggdegmo.*
windowrule = workspace 19 silent, match:title ^(Microsoft Teams.*|Skype.*)$
windowrule = tile on,             match:class (?i).*teams[-_]for[-_]linux.*
windowrule = tile on,             match:class (?i).*(microsoft.teams|slack|skype).*

# --- Telegram / WhatsApp → ws 18 (HDMI-A-1), no switch ---
windowrule = workspace 18 silent, match:class (?i)(telegram[.-]?desktop)
windowrule = workspace 18 silent, match:title ^(WhatsApp Web|Telegram)$
windowrule = tile on,             match:class (?i)(telegram[.-]?desktop)

# --- Spotify → ws 17 (HDMI-A-1), no switch ---
windowrule = workspace 17 silent, match:class (?i)^spotify$
windowrule = tile on,             match:class (?i)^spotify$

# --- Thunderbird → ws 5 (DP-1), no switch ---
windowrule = workspace special:thundermail silent, match:class (?i).*(thunderbird|mail).*
windowrule = tile on,             match:class (?i).*(thunderbird|mail).*

# ===== Intentionally dropped from your Awesome config =====
# - Mod+c (quickconfig)             — no longer used
# - Mod+/ (help popup)              — no native equivalent; can add a fuzzel cheatsheet later
# - Mod+u (jump to urgent)          — Hyprland fires urgent events but no built-in dispatcher
# - Mod+n (minimize)                — Hyprland has no minimize concept
# - Mod+Ctrl+1..9 (multi-tag join)  — Hyprland workspaces are single-select
# - Mod+Ctrl+Shift+1..9 (sticky)    — closest is Mod+t (pin to all workspaces)
# - Mod+Ctrl+m / Mod+Shift+m (V/H maximize) — not directly available
# - Mod+Ctrl+h/l (column count)     — dwindle/master are not multi-column
# - Mod+Shift+h/l (master count)    — replaced by directional move; use 'hyprctl dispatch layoutmsg addmaster' if missed

