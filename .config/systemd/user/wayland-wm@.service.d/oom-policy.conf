# One process die instead of whole session
#
# Upstream default is OOMPolicy=stop: if the kernel OOM-killer kills ANY
# process in this unit's cgroup, systemd tears down the whole compositor
# unit -- i.e. one fat process dying dumps you back to SDDM.
#
# 2026-09-18: a full `yarn test` (10 ts-jest workers, ~7GB in 3 min) drove
# the box into global OOM. The kernel killed Jedi Survivor as the largest
# process, and OOMPolicy=stop turned that single kill into a full session
# teardown + Hyprland segfault.

[Service]
OOMPolicy=continue
